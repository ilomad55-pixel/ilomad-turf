# Production — VPS partagé avec la production d'autres projets.
#
#   - aucun port ouvert sur Internet : PostgreSQL n'écoute que sur 127.0.0.1 ;
#   - mémoire et CPU plafonnés sur chaque service ;
#   - les données brutes sont dans ../data, monté sur /data ; la base, qui se
#     reconstruit depuis elles, est dans un volume Docker.
#
# Lancement, depuis la racine du projet :
#   docker compose -f docker/docker-compose.prod.yml up -d --build
#
# Procédure complète : docs/PLAN-DEPLOIEMENT.md

name: ilomad-turf

x-service: &service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: ilomad-turf:local
  env_file: ../.env
  environment:
    TURF_DONNEES: /data
  volumes:
    - ../data:/data
  restart: unless-stopped
  # Chaque service termine ce qu'il a en cours avant de s'arrêter (quelques secondes).
  stop_grace_period: 30s
  logging: &journaux
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # Suit le programme du jour et prend les instantanés, à 1 requête par seconde au plus.
  # Ne dépend d'aucun autre service : rien de ce qui suit ne peut l'arrêter (ADR 0005).
  collecteur:
    <<: *service
    command: ["turf", "collect"]
    mem_limit: 192m
    cpus: 0.25

  # Veille sur le collecteur et le disque, lance la sauvegarde nocturne.
  # Séparé du collecteur : un collecteur planté ne peut pas s'alerter lui-même.
  surveillance:
    <<: *service
    command: ["turf", "surveiller"]
    mem_limit: 256m
    cpus: 0.25

  # Base de travail. Tout son contenu se reconstruit depuis data/raw :
  # elle n'est donc pas sauvegardée.
  postgres:
    image: postgres:17
    # POSTGRES_PASSWORD vient de ../.env.
    env_file: ../.env
    environment:
      POSTGRES_USER: turf
      POSTGRES_DB: turf
    volumes:
      - base:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5440:5432"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turf -d turf"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *journaux

  # Charge dans la base ce que le collecteur écrit sur disque, toutes les cinq minutes.
  # Met la base à niveau au démarrage. Ne fait que lire les données brutes.
  ingestion:
    <<: *service
    command: ["turf", "parse", "--en-continu"]
    volumes:
      - ../data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0

  # Application : programme du jour, marché, santé de la collecte. Ne fait que lire.
  # N'écoute que sur 127.0.0.1 : on l'ouvre depuis son poste par un tunnel SSH
  # (docs/PLAN-DEPLOIEMENT.md § 11).
  app:
    <<: *service
    command: ["turf", "app", "--adresse", "0.0.0.0"]
    environment:
      TURF_DONNEES: /data
      # Streamlit écrit ses réglages dans le dossier personnel, que l'utilisateur
      # du conteneur n'a pas.
      HOME: /tmp
    volumes:
      - ../data:/data:ro
    ports:
      - "127.0.0.1:8510:8510"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5

  # Pronostique les courses de trot du jour à H-30 et H-5 avec le modèle actif
  # (data/models/actif.txt). Écrit son journal dans data/pronostics, puis dans la base.
  # N'interroge pas la source : seulement la base et le disque.
  inference:
    <<: *service
    command: ["turf", "pronostiquer", "--en-continu"]
    depends_on:
      postgres:
        condition: service_healthy
    # Le calcul des variables du jour relit tout l'historique : environ 1 Go au pic.
    mem_limit: 1g
    cpus: 0.5

  # Commandes ponctuelles et gourmandes : export Parquet, rapport de référence.
  # Ne démarre pas avec « up ». Usage :
  #   docker compose -f docker/docker-compose.prod.yml run --rm outils turf export
  outils:
    <<: *service
    profiles: ["outils"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 1.0

volumes:
  base:
