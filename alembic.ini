# Utilisé seulement en développement, pour écrire une nouvelle migration :
#
#   $env:TURF_BASE_URL = "postgresql+psycopg://turf@127.0.0.1:5440/turf_test"
#   .\.venv\Scripts\alembic.exe revision --autogenerate -m "description du changement"
#
# En production, les migrations sont appliquées par « turf migrate », sans ce fichier.

[alembic]
script_location = src/turf/db/migrations
file_template = %%(rev)s_%%(slug)s
# L'adresse de la base vient de TURF_BASE_URL (voir src/turf/db/migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = simple

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = simple

[formatter_simple]
format = %(levelname)s %(name)s : %(message)s
