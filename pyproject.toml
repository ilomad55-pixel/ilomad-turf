[project]
name = "ilomad-turf"
version = "0.1.0"
description = "Application personnelle de probabilités calibrées pour les courses de trot"
readme = "README.md"
requires-python = ">=3.13"
# Les dépendances sont ajoutées sprint par sprint, au moment où le code en a besoin.
# Le spike du sprint 0 n'utilise que la bibliothèque standard.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
