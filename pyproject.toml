[project]
name = "ilomad-turf"
version = "0.5.0"
description = "Application personnelle de probabilités calibrées pour les courses de trot"
readme = "README.md"
requires-python = ">=3.13"
# Les dépendances sont ajoutées sprint par sprint, au moment où le code en a besoin.
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=2.1",
    "polars>=1.20",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "streamlit>=1.40",
    "typer>=0.12",
    # Base des fuseaux horaires : absente de Windows et des images Docker « slim ».
    "tzdata>=2024.1",
]

[project.scripts]
turf = "turf.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer déclare ses options par des appels dans les valeurs par défaut : c'est son usage normal.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
